name: deepfilter_livekit CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/
      - run: flutter analyze

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build-example:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-cmd: cd example && flutter build linux --release
          - os: windows-latest
            build-cmd: cd example && flutter build windows --release
          - os: macos-latest
            build-cmd: cd example && flutter build macos --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build example app
        run: ${{ matrix.build-cmd }}

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-example]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="deepfilter_livekit-$VERSION"
          cd /tmp
          mkdir -p "$PKG"
          git -C "$GITHUB_WORKSPACE" archive --format=tar \
            --prefix="$PKG/" HEAD | tar -xf -
          tar -czf "$PKG.tar.gz" "$PKG/"
          mv "$PKG.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepfilter_livekit-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
